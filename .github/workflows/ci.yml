name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0

jobs:
  zig:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: fmt
        run: zig fmt --check build.zig build.zig.zon src tools examples/oneshot
      # The live tests need the real CLIs and accounts; CI runs the rest.
      - name: test
        run: zig build test --summary all
      - name: generated bindings are current
        if: runner.os == 'Linux'
        run: zig build bindgen && git diff --exit-code schema bindings/go/protocol.go bindings/go/methods.go bindings/rust/src/protocol.rs bindings/rust/src/methods.rs bindings/typescript/src/protocol.ts bindings/typescript/src/methods.ts
      # Every platform the bindings download from a release.
      - name: release builds
        if: runner.os == 'Linux'
        run: zig build release

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
      - run: zig build -Doptimize=ReleaseFast
      - name: binding
        working-directory: bindings/go
        run: test -z "$(gofmt -l .)" && go vet ./... && go test -race ./...
      - name: examples
        working-directory: examples
        run: go vet ./... && go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: zig build -Doptimize=ReleaseFast
      - working-directory: bindings/rust
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: zig build -Doptimize=ReleaseFast
      - working-directory: bindings/typescript
        run: npm ci && npx tsc --noEmit && node --test
      - working-directory: examples/orchestrator
        run: npm ci && npx tsc --noEmit
